name: "App: pull request build"

# Builds every pull request (the weekly upstream-sync one included) with a read-only token, no
# secrets and no saved git credentials: code under review can compile and fail, but it can't push,
# tag, start a release or reach the upload key. Its .ipa leaves the job only encrypted to
# .github/pr-build.pub; main may reuse it when the merge has exactly this code (release.yml), and
# only release.yml can decrypt it. The job is named "build" like release.yml's, so the required
# check is the same.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.MAC_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
          persist-credentials: false

      - name: Xcode and Swift packages
        id: xcode-setup
        uses: ./.github/actions/xcode

      - name: Build
        id: build
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          agvtool new-version -all "$HEAD_SHA"
          make

      # What fills the download, so a change that grows it shows in review. Sizes and counts only;
      # a failure here never fails the build.
      - name: Size report
        id: size-report
        continue-on-error: true
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, subprocess, zipfile

          ipa, app = "packages/Accretion.ipa", "_build/Payload/Accretion.app"
          with zipfile.ZipFile(ipa) as z:
              files = [i for i in z.infolist() if not i.is_dir()]
          print("### Download size")
          print(f"`Accretion.ipa`: {os.path.getsize(ipa):,} bytes, {len(files)} files, "
                f"{sum(i.file_size for i in files) / 1e6:.1f} MB unpacked\n")
          print("| File | In the download (KB) | Unpacked (KB) |\n| --- | ---: | ---: |")
          for i in sorted(files, key=lambda i: -i.compress_size)[:10]:
              name = i.filename.removeprefix("Payload/Accretion.app/")
              print(f"| `{name}` | {i.compress_size / 1024:,.0f} | {i.file_size / 1024:,.0f} |")

          exported = subprocess.run(["nm", "-gU", f"{app}/Feather"], capture_output=True, text=True).stdout
          print(f"\nApp binary: {len(exported.splitlines()):,} exported symbols")

          info = subprocess.run(["xcrun", "--sdk", "iphoneos", "assetutil", "--info", f"{app}/Assets.car"],
                                capture_output=True, text=True).stdout
          items = [r for r in json.loads(info) if "SizeOnDisk" in r]
          print(f"\n`Assets.car`: {len(items)} renditions, {sum(r['SizeOnDisk'] for r in items) / 1024:,.0f} KB\n")
          print("| Asset | Rendition | Pixels | Idiom | Appearance | KB |\n| --- | --- | --- | --- | --- | ---: |")
          for r in sorted(items, key=lambda r: -r["SizeOnDisk"])[:12]:
              appearance = r.get("Appearance", "").removeprefix("NSAppearanceName").removeprefix("UIAppearance")
              print(f"| {r.get('Name', '')} | {r.get('RenditionName', '')[:28]} | "
                    f"{r.get('PixelWidth', '')}x{r.get('PixelHeight', '')} | {r.get('Idiom', '')} | "
                    f"{appearance} | {r['SizeOnDisk'] / 1024:,.0f} |")
          PY

      # main reuses this build when the merge has exactly this code (release.yml, "Restore the pull
      # request build"), so a change compiles once. The .ipa is private and this job has no secrets:
      # it's encrypted to the public key .github/pr-build.pub; only release.yml holds the private key
      # (secret PR_BUILD_KEY). Pull requests from forks are never reused.
      - name: Encrypt this build for main
        id: encrypt-build
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr-build"
          mkdir -p "$out"
          FILE_KEY=$(openssl rand -hex 32)
          export FILE_KEY
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:FILE_KEY \
            -in packages/Accretion.ipa -out "$out/Accretion.ipa.enc"
          printf '%s' "$FILE_KEY" | openssl pkeyutl -encrypt -pubin -inkey .github/pr-build.pub \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out "$out/Accretion.key.enc"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Keep this build for main
        id: keep-build
        if: steps.encrypt-build.outputs.dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accretion-ipa-${{ github.event.pull_request.head.sha }}
          path: ${{ steps.encrypt-build.outputs.dir }}
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: |
          failed=$(jq -r 'to_entries | map(select(.value.conclusion == "failure") | .key | gsub("-"; " ")) | join(", ")' <<< "$STEPS")
          {
            if [ "$JOB_STATUS" = success ]; then
              echo "### The pull request builds"
            else
              echo "### The pull request doesn't build"
              echo "Failed step: ${failed:-unknown}. Open that step above to read the log."
            fi
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| " + (.key | gsub("-"; " ")) + " | " + (.value.conclusion // "not run") + " |"' <<< "$STEPS"
            echo
            echo "Read-only build: no secrets, no write token (handbook issue #26)."
          } >> "$GITHUB_STEP_SUMMARY"
