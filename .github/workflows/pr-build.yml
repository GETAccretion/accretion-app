name: "App: pull request build"

# Builds every pull request (the weekly upstream-sync one included) with a read-only token, no
# secrets and no saved git credentials: code under review can compile and fail, but it can't push,
# tag, start a release or reach the upload key. Releases only build code already on main or a tag
# (release.yml). The job is named "build" like release.yml's, so the required check is the same.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.MAC_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
          persist-credentials: false

      - name: Xcode and Swift packages
        id: xcode-setup
        uses: ./.github/actions/xcode

      - name: Build
        id: build
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          agvtool new-version -all "$HEAD_SHA"
          make

      # main reuses this build when the merge has exactly this code (release.yml, "Restore the pull
      # request build"), so a change compiles once. The .ipa is private and this job has no secrets:
      # it's encrypted to the public key .github/pr-build.pub; only release.yml holds the private key
      # (secret PR_BUILD_KEY). Pull requests from forks are never reused.
      - name: Encrypt this build for main
        id: encrypt-build
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr-build"
          mkdir -p "$out"
          FILE_KEY=$(openssl rand -hex 32)
          export FILE_KEY
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:FILE_KEY \
            -in packages/Accretion.ipa -out "$out/Accretion.ipa.enc"
          printf '%s' "$FILE_KEY" | openssl pkeyutl -encrypt -pubin -inkey .github/pr-build.pub \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out "$out/Accretion.key.enc"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Keep this build for main
        id: keep-build
        if: steps.encrypt-build.outputs.dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accretion-ipa-${{ github.event.pull_request.head.sha }}
          path: ${{ steps.encrypt-build.outputs.dir }}
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: |
          failed=$(jq -r 'to_entries | map(select(.value.conclusion == "failure") | .key | gsub("-"; " ")) | join(", ")' <<< "$STEPS")
          {
            if [ "$JOB_STATUS" = success ]; then
              echo "### The pull request builds"
            else
              echo "### The pull request doesn't build"
              echo "Failed step: ${failed:-unknown}. Open that step above to read the log."
            fi
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| " + (.key | gsub("-"; " ")) + " | " + (.value.conclusion // "not run") + " |"' <<< "$STEPS"
            echo
            echo "Read-only build: no secrets, no write token (handbook issue #26)."
          } >> "$GITHUB_STEP_SUMMARY"
