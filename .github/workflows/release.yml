name: "App: build and release"

# Every push to main builds Accretion.ipa as a check (nothing is kept: builds are private).
# Pushing a tag like accretion-v1.0.5 uploads it to the store's private storage, publishes a
# notes-only release and points app-repo.json at the store's download server.
on:
  pull_request:
  push:
    branches:
      - main
    # Files that never reach the IPA: no build (list kept equal to NOT_BUILD_INPUTS in
    # .github/scripts/release_guard.py by a test). Tag pushes always build.
    paths-ignore:
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/actions/alert/**'
      - '.github/dependabot.yml'
      - '.github/tests/**'
      - '.github/workflows/screens.yml'
      - '.github/workflows/secrets.yml'
      - '.github/workflows/ship.yml'
      - '.github/workflows/tests.yml'
      - '.github/workflows/upstream.yml'
      - '.gitleaks.toml'
    tags:
      - accretion-v*
  workflow_dispatch:

permissions:
  actions: write
  statuses: write
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
          fetch-depth: 0 # the whole history, so release notes can list the changes since the last tag

      # The app's colours come from the store's design/tokens.json (one source for web and app).
      # Warn when AccretionTokens.swift is behind it; never blocks a build.
      - name: Check design tokens
        id: design-tokens
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/store"
          mkdir -p "$STORE/scripts" "$STORE/design" "$STORE/site"
          RAW=https://raw.githubusercontent.com/GETAccretion/getaccretion.github.io/main
          for f in scripts/design_tokens.py scripts/common.py design/tokens.json site/style.css; do
            curl -fsSL "$RAW/$f" -o "$STORE/$f"
          done
          python3 "$STORE/scripts/design_tokens.py" --app "$GITHUB_WORKSPACE" > /dev/null
          if ! git diff --quiet -- Feather/Views/Accretion/Theme/AccretionTokens.swift; then
            echo "::warning::AccretionTokens.swift is behind the store's design/tokens.json. Run scripts/design_tokens.py --app in the store repo and commit the result here."
            git checkout -- Feather/Views/Accretion/Theme/AccretionTokens.swift
          else
            echo "Design tokens match the store."
          fi

      # A release reuses main's build of the same code instead of compiling it again: the main
      # build keeps its .ipa in the repo's Actions cache, encrypted with ACCRETION_UPLOAD_KEY
      # (caches can be read by fork pull requests, which never get secrets). The release only
      # stamps the new version into it. If that build isn't cached, the release compiles as before.
      - name: Find main's build of this code
        id: find-main-build
        if: startsWith(github.ref, 'refs/tags/accretion-v') || startsWith(github.ref, 'refs/heads/automation/checked-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(gh run list --workflow release.yml --branch main --event push --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty')
          # only the version (Feather.xcconfig) and app-repo.json may differ from what was built
          if [ -n "$built" ] && git cat-file -e "$built^{commit}" 2>/dev/null \
             && python3 .github/scripts/release_guard.py compare "$built" HEAD; then
            echo "sha=$built" >> "$GITHUB_OUTPUT"
          else
            echo "No reusable main build; compiling."
          fi

      - name: Restore main's build
        id: restore-main-build
        if: steps.find-main-build.outputs.sha != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/Accretion.ipa.enc
          key: accretion-ipa-${{ steps.find-main-build.outputs.sha }}

      - name: Stamp the new version into main's build
        id: stamp-version
        if: steps.restore-main-build.outputs.cache-hit == 'true'
        env:
          UPLOAD_KEY: ${{ secrets.ACCRETION_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          if ! python3 .github/scripts/release_guard.py restore packages/Accretion.ipa.enc packages/Accretion.ipa; then
            echo "Cache unavailable; compiling this version."
            exit 0
          fi
          rm packages/Accretion.ipa.enc
          NEW=$(sed -n 's/^FEATHER_PROJECT_VERSION=//p' Feather.xcconfig)
          WORK="$RUNNER_TEMP/ipa"
          rm -rf "$WORK"; mkdir -p "$WORK"
          ditto -x -k packages/Accretion.ipa "$WORK"
          OLD=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$WORK/Payload/Accretion.app/Info.plist")
          # the app and anything inside it built with the same version
          find "$WORK/Payload" -name Info.plist -print0 | while IFS= read -r -d '' plist; do
            current=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$plist" 2>/dev/null || true)
            if [ "$current" = "$OLD" ]; then
              /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $NEW" "$plist"
            fi
          done
          rm packages/Accretion.ipa
          ditto -c -k --sequesterRsrc --keepParent "$WORK/Payload" packages/Accretion.ipa
          # never release a damaged or mislabelled build
          unzip -tq packages/Accretion.ipa
          check=$(unzip -p packages/Accretion.ipa Payload/Accretion.app/Info.plist > "$RUNNER_TEMP/check.plist" \
            && /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$RUNNER_TEMP/check.plist")
          [ "$check" = "$NEW" ] || { echo "::error::Stamped build says $check, expected $NEW"; exit 1; }
          echo "done=true" >> "$GITHUB_OUTPUT"
          echo "Reused main's build ${{ steps.find-main-build.outputs.sha }}: $OLD → $NEW" >> "$GITHUB_STEP_SUMMARY"

      - name: Xcode and Swift packages
        id: xcode-setup
        if: steps.stamp-version.outputs.done != 'true'
        uses: ./.github/actions/xcode

      - name: Build
        id: build
        if: steps.stamp-version.outputs.done != 'true'
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          make

      - name: Encrypt this build for Ship
        id: encrypt-build
        if: github.ref == 'refs/heads/main'
        env:
          UPLOAD_KEY: ${{ secrets.ACCRETION_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEY" || { echo "::warning::ACCRETION_UPLOAD_KEY isn't set; Ship will compile again"; exit 0; }
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:UPLOAD_KEY \
            -in packages/Accretion.ipa -out packages/Accretion.ipa.enc

      - name: Keep this build for Ship
        id: keep-build
        if: github.ref == 'refs/heads/main' && hashFiles('packages/Accretion.ipa.enc') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/Accretion.ipa.enc
          key: accretion-ipa-${{ github.sha }}

      - name: Get Version
        id: get-version
        # read it from the .ipa
        run: |
          unzip -p packages/Accretion.ipa Payload/Accretion.app/Info.plist > "$RUNNER_TEMP/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$RUNNER_TEMP/Info.plist")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          # betas have four numbers (1.0.25.1): Beta Updates only
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "BETA=true" >> $GITHUB_ENV; else echo "BETA=false" >> $GITHUB_ENV; fi

      # The .ipa is private: it goes straight into the store's private bucket, served only to
      # signed-in users (and personal source links) by the download server. Builds aren't kept
      # as workflow artifacts, which anyone signed in to GitHub could download.
      - name: Upload to private storage
        id: upload
        if: startsWith(github.ref, 'refs/tags/accretion-v')
        env:
          UPLOAD_KEY: ${{ secrets.ACCRETION_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEY" || { echo "ACCRETION_UPLOAD_KEY is not set"; exit 1; }
          FN="https://bbcjpinhvlxocjxlyplt.supabase.co/functions/v1/upload"
          SIZE=$(stat -f%z packages/Accretion.ipa)
          SHA=$(shasum -a 256 packages/Accretion.ipa | cut -d' ' -f1)
          # What's new post: commit titles since the previous release, minus housekeeping
          PREV=$(git describe --tags --abbrev=0 --match 'accretion-v*' "$GITHUB_SHA^" 2>/dev/null || true)
          # only commits that change the app itself: not workflows, tests, the store source or version bumps
          NOTES=$(git log --no-merges --format='• %s' ${PREV:+"$PREV..$GITHUB_SHA"} -- . ':!.github' ':!CoreTests' ':!app-repo.json' ':!app-repo-beta.json' ':!Feather.xcconfig' | head -25 || true)
          # betas aren't announced in What's new (announce: false)
          BODY=$(jq -n --arg v "$VERSION" --argjson s "$SIZE" --arg h "$SHA" --arg n "$NOTES" --argjson beta "$BETA" '{bundle_id: "io.github.getaccretion.Accretion", version: $v, size: $s, sha256: $h, name: "Accretion", notes: $n, announce: ($beta | not)}')
          PREPARED=$(curl -fsS -X POST "$FN" -H "x-upload-key: $UPLOAD_KEY" -H "Content-Type: application/json" -d "$BODY")
          if [ "$(jq -r '.published // false' <<< "$PREPARED")" != true ]; then
            SIGNED=$(jq -er '.signedUrl' <<< "$PREPARED")
            echo "::add-mask::$SIGNED"
            UPLOAD_ID=$(jq -er '.upload_id' <<< "$PREPARED")
            BODY=$(jq --arg id "$UPLOAD_ID" '. + {upload_id: $id}' <<< "$BODY")
            curl -fsS -X PUT "$SIGNED" -H "Content-Type: application/octet-stream" --data-binary @packages/Accretion.ipa > /dev/null
            curl -fsS -X POST "$FN?finish=1" -H "x-upload-key: $UPLOAD_KEY" -H "Content-Type: application/json" -d "$BODY"
          fi
          # the GitHub release lists the same changes (generated notes only list pull requests)
          { echo "Download Accretion from the store (sign in first): https://getaccretion.app/#/app/io.github.getaccretion.Accretion"
            if [ -n "$NOTES" ]; then echo; echo "### What's changed"; echo "$NOTES"; fi; } > "$RUNNER_TEMP/release-notes.md"

      - name: Create Release
        id: create-release
        if: startsWith(github.ref, 'refs/tags/accretion-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v3.0.2
        with:
          name: Accretion v${{ env.VERSION }}${{ env.BETA == 'true' && ' (beta)' || '' }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ env.BETA == 'true' }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true

      # Releases made with GITHUB_TOKEN don't trigger other workflows, so the app source is updated here.
      - name: Update app-repo.json
        id: update-source
        if: startsWith(github.ref, 'refs/tags/accretion-v')
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }} # never expanded into the script text
        run: |
          git fetch --quiet origin main
          git checkout --quiet main
          SIZE=$(stat -f%z packages/Accretion.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          URL="https://bbcjpinhvlxocjxlyplt.supabase.co/functions/v1/download?app=io.github.getaccretion.Accretion&version=$VERSION"
          point() {
            jq --arg version "$VERSION" --arg date "$DATE" --arg url "$URL" --argjson size "$SIZE" '
              .apps[0].version = $version | .apps[0].versionDate = $date |
              .apps[0].downloadURL = $url | .apps[0].size = $size |
              .apps[0].versions = [{version: $version, date: $date, size: $size, downloadURL: $url, minOSVersion: "16.0"}]
            ' "$1" > tmp.json
            mv tmp.json "$1"
          }
          # app-repo-beta.json (Beta Updates) always gets the newest build; app-repo.json releases only
          [ -f app-repo-beta.json ] || jq '.name = "Accretion App (beta)" | .identifier = "io.github.getaccretion.app-repo-beta"' app-repo.json > app-repo-beta.json
          point app-repo-beta.json
          if [ "$BETA" != true ]; then point app-repo.json; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-repo.json app-repo-beta.json
          git diff --cached --quiet && exit 0
          git commit -m "Point the app source at $REF_NAME"
          python3 .github/scripts/checked_push.py app

      - name: Summary
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          HEADLINE: ${{ startsWith(github.ref, 'refs/tags/accretion-v') && 'Released Accretion' || 'Build passed (a normal push publishes nothing)' }}
          REF: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/accretion-v') }}
          REUSED: ${{ steps.stamp-version.outputs.done }}
        run: |
          failed=$(jq -r 'to_entries | map(select(.value.conclusion == "failure") | .key | gsub("-"; " ")) | join(", ")' <<< "$STEPS")
          {
            if [ "$JOB_STATUS" = success ]; then
              echo "### $HEADLINE"
            else
              echo "### The build or release failed"
              echo "Failed step: ${failed:-unknown}. If it is the Build step, open it for the compiler error. If it is the upload step, check the ACCRETION_UPLOAD_KEY secret. Then run the build again."
            fi
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| " + (.key | gsub("-"; " ")) + " | " + (.value.conclusion // "not run") + " |"' <<< "$STEPS"
            echo
            echo "| Fact | Value |"
            echo "| --- | --- |"
            echo "| Version | ${VERSION:-not built} |"
            echo "| Beta | ${BETA:-no} |"
            echo "| Build | $([ "$REUSED" = true ] && echo "reused the build from main" || echo compiled) |"
            echo "| Source | $REF |"
            if [ "$IS_TAG" = true ]; then echo "| Release | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$REF |"; fi
          } >> "$GITHUB_STEP_SUMMARY"
