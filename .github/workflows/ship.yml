name: Ship

# Release Accretion from anywhere, including the GitHub app on a phone: Actions → Ship → Run.
# Checks that main's latest build passed, raises the version (next patch unless one is given),
# tags it, and starts the Release run for that tag, which uploads it privately, publishes the
# notes-only release and points app-repo.json at it. The store picks it up on its next build.
# Beta: a test build numbered between releases (1.0.25 -> 1.0.25.1, 1.0.25.2 ...). Only people with
# Settings -> Beta Updates on get it (app-repo-beta.json); the next release (1.0.26) replaces it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 1.0.20 (leave empty for the next patch, or the next beta)"
        required: false
        default: ""
      beta:
        description: "Beta (test build for Beta Updates only)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # Main's latest build must have passed, with no code changed since
      - name: Check the latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r conclusion built < <(gh run list --workflow release.yml --branch main --event push --limit 1 \
            --json conclusion,headSha --jq '.[0] | "\(.conclusion) \(.headSha)"')
          if [ "$conclusion" != success ]; then
            echo "::error::Main's latest build (${built:0:7}) didn't pass ($conclusion). Fix it, then ship."
            exit 1
          fi
          # version bumps and app-repo.json updates are made by workflows, which don't start builds
          if ! python3 .github/scripts/release_guard.py compare "$built" HEAD; then
            echo "::error::Code or build settings changed after main's last successful build. Build them first."
            exit 1
          fi

      - name: Raise the version, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          BETA: ${{ inputs.beta }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^FEATHER_PROJECT_VERSION=//p' Feather.xcconfig)
          # the last release: a beta's version (1.0.25.2) belongs to release 1.0.25
          IFS=. read -r major minor patch _ <<< "$current"
          release="$major.$minor.$patch"
          next="$INPUT_VERSION"
          if [ -z "$next" ] && [ "$BETA" = true ]; then
            n=$(git tag --list "accretion-v$release.*" | wc -l)
            next="$release.$((n + 1))"
          elif [ -z "$next" ]; then
            next="$major.$minor.$((patch + 1))"
          fi
          if [ "$BETA" = true ]; then
            [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::A beta is numbered like 1.0.25.1, not \"$next\""; exit 1; }
          elif ! [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\"$next\" isn't a version like 1.0.20"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/accretion-v$next" > /dev/null; then
            echo "::error::accretion-v$next already exists"
            exit 1
          fi
          sed -i "s/^FEATHER_PROJECT_VERSION=.*/FEATHER_PROJECT_VERSION=$next/" Feather.xcconfig
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Version $next"
          python3 .github/scripts/checked_push.py app
          git tag "accretion-v$next"
          git push -q origin "refs/tags/accretion-v$next"
          # pushes made with this token don't start workflows; a dispatch does
          gh workflow run release.yml --ref "accretion-v$next"
          echo "### Shipping Accretion $next$([ "$BETA" = true ] && echo ' (beta)')" >> "$GITHUB_STEP_SUMMARY"
          echo "Follow the **Release** run for \`accretion-v$next\`. It reuses main's build (a few minutes), or compiles again if that build isn't cached (about 10 minutes)." >> "$GITHUB_STEP_SUMMARY"
